[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trackmater"
version = "0.1.0"
description = "Analysis of TrackMate (ImageJ/Fiji) single-particle tracking data in Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Stephen J Royle", email = "admin@quantixed.org"},
]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "matplotlib>=3.5",
    "scipy>=1.8",
]

[project.optional-dependencies]
full = ["seaborn>=0.12"]
dev = ["pytest>=7", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
include = ["trackmater*"]

[tool.setuptools.package-data]
trackmater = ["data/*.xml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
